name: Engine

# Builds and verifies the vendored OpenSSL engine (ADR-001) on every supported
# platform, then runs the parts of the test suite that need a real engine -
# design-dossier §8 criteria 1-6, on all three platforms (criterion 9).
#
# Kept out of ci.yml because the first engine build takes minutes. Subsequent
# runs restore it from cache, so adding src/ and tests/ to the triggers costs
# about a minute per push while making the acceptance criteria a gate rather
# than a claim.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'go.mod'
      - 'Makefile'
      - 'scripts/openssl-pin.env'
      - 'scripts/build-openssl.sh'
      - 'scripts/verify-openssl.sh'
      - '.github/workflows/engine.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'go.mod'
      - 'Makefile'
      - 'scripts/openssl-pin.env'
      - 'scripts/build-openssl.sh'
      - 'scripts/verify-openssl.sh'
      - '.github/workflows/engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: engine (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: darwin-arm64
          - os: ubuntu-latest
            name: linux-amd64
          - os: ubuntu-24.04-arm
            name: linux-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Restore cached engine
        id: engine-cache
        uses: actions/cache@v6
        with:
          path: dist/engine
          key: openssl-${{ matrix.name }}-${{ hashFiles('scripts/openssl-pin.env', 'scripts/build-openssl.sh') }}

      - name: Build engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: scripts/build-openssl.sh --out dist/engine

      # Pass the pinned version explicitly so a stale or corrupt cache entry
      # restoring the wrong engine fails here, before the acceptance tests run
      # against it (release.yml asserts the same way).
      - name: Verify engine
        run: |
          scripts/verify-openssl.sh dist/engine/openssl \
            "$(sed -n 's/^OPENSSL_VERSION=//p' scripts/openssl-pin.env)"

      - name: Run the engine-backed acceptance tests
        run: make test-engine

      - name: Report engine size
        run: ls -l dist/engine
